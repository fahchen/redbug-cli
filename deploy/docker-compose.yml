# Local simulation of the remote, kamal-deployed target node.
#
# No published ports and no loopback alias: OrbStack makes every container
# reachable from the macOS host at its own container IP, so the local controller
# dials the node directly at target@<container-ip>. That IP differs from
# 127.0.0.1, so the container's epmd never collides with the controller's local
# epmd on 127.0.0.1:4369.
#
# After `docker compose up -d`, get the node host with:
#   docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redbug-target
# and run the TUI with REDBUG_TARGET=target@<that-ip>.
#
# (The real kamal path instead uses an SSH tunnel to target@127.0.0.2 — see
# deploy.yml. The node auto-detects its host either way.)
services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redbug-target
    environment:
      DIST_PORT: "9100"
      COOKIE: "poc"
