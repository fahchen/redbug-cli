# kamal deploy config for the demo target node (the app being traced).
# Run from this dir:  kamal deploy -c deploy.yml
#
# SECURITY: epmd (4369) and the distribution port (9100) are published only to
# the remote host's loopback (127.0.0.2), never to 0.0.0.0. They are NOT exposed
# to the internet. The local controller reaches them through an SSH tunnel to the
# kamal host (see TUNNEL below). A reachable cookie == remote code execution, so
# the distribution surface must stay private.

service: redbug-target

# Built from deploy/Dockerfile (the demo target). Point image at your registry.
image: REGISTRY/redbug-target

servers:
  - REMOTE_HOST_IP

registry:
  server: REGISTRY
  username: REGISTRY_USER
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64 # match the remote host arch
  dockerfile: Dockerfile

env:
  clear:
    DIST_HOST: "127.0.0.2"
    DIST_PORT: "9100"
  secret:
    - COOKIE

# Bind dist + epmd to the host loopback alias only. kamal/docker on the remote
# publishes container ports here; nothing hits a public interface.
#
# Linux hosts have 127.0.0.2 as loopback natively. If the host lacks the alias:
#   sudo ip addr add 127.0.0.2/8 dev lo
ports:
  - "127.0.0.2:4369:4369"
  - "127.0.0.2:9100:9100"

# ── TUNNEL (run locally, NOT part of kamal) ──────────────────────────────────
# Forward the remote loopback dist surface to the same loopback alias locally:
#
#   sudo ifconfig lo0 alias 127.0.0.2 up        # macOS, once per boot
#   ssh -N \
#     -L 127.0.0.2:4369:127.0.0.2:4369 \
#     -L 127.0.0.2:9100:127.0.0.2:9100 \
#     deploy@REMOTE_HOST_IP
#
# Then the local controller connects to target@127.0.0.2 with the COOKIE —
# byte-for-byte the same target the local docker-compose sim uses.
