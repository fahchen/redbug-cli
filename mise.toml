[tools]
erlang = "28.3"
elixir = "1.19.5-otp-28"
bun = "1.3"

[tasks.dev]
description = "Start server (random free port) then TUI; cookie via RB_COOKIE (default rbtest)"
dir = "server"
run = """
set -e
cookie="${RB_COOKIE:-rbtest}"
port_file="/tmp/redbug.port"
rm -f "$port_file"
export REDBUG_PORT_FILE="$port_file"
# REDBUG_NODES → bypass epmd with the connect-only shim (see Server.Epmd). The
# shim module is only loaded once the app starts, so distribution must NOT come
# up at boot via --name; the app self-distributes (CONTROLLER_NODE) afterwards.
# Trim first: a whitespace-only value parses to zero nodes, so don't let it flip
# the server into shim boot and disable normal epmd connects.
redbug_nodes_trimmed=$(printf '%s' "$REDBUG_NODES" | tr -d '[:space:]')
# Server shares this terminal with the TUI, so silence its stdout/stderr into a
# log file (tail it when debugging) instead of corrupting the TUI screen.
log_file="${REDBUG_SERVER_LOG:-/tmp/redbug-server.log}"
if [ -n "$redbug_nodes_trimmed" ]; then
  export ERL_FLAGS="-start_epmd false -epmd_module Elixir.Server.Epmd${ERL_FLAGS:+ $ERL_FLAGS}"
  export CONTROLLER_NODE="redbug_controller@127.0.0.1"
  export CONTROLLER_COOKIE="$cookie"
  elixir -S mix phx.server >"$log_file" 2>&1 &
else
  elixir --name redbug_controller@127.0.0.1 --cookie "$cookie" -S mix phx.server >"$log_file" 2>&1 &
fi
server_pid=$!
trap 'kill $server_pid 2>/dev/null' EXIT INT TERM
until [ -f "$port_file" ]; do sleep 0.2; done
port=$(cat "$port_file")
until nc -z 127.0.0.1 "$port" 2>/dev/null; do sleep 0.2; done
cd ../tui && REDBUG_PORT="$port" bun run dev
"""

[tasks.package]
description = "Build single-file dist/redbug (bun --compile embedding the server release)"
run = """
set -e
root="$(pwd)"
# Build the controller release (ERTS bundled) and tar it for embedding.
cd "$root/server" && MIX_ENV=prod mix release server --overwrite
mkdir -p "$root/tui/embed"
tar -czf "$root/tui/embed/server.tar.gz" -C "$root/server/_build/prod/rel" server
# redbug = single file (main.tsx embeds the tarball, extracts + spawns it at runtime).
# Compiles straight into the root dist/ (build script targets ../dist).
rm -rf "$root/dist"
mkdir -p "$root/dist"
cd "$root/tui" && bun install && bun run build:redbug
chmod +x "$root/dist/redbug"
echo "packaged -> dist/redbug (single file; run it to launch)"
"""
