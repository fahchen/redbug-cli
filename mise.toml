[tools]
# The first version of each list is the default. The others are target nodes of the
# older supported OTP versions for server/test/remote/inject_test.exs.
erlang = ["29.1.1", "27.2.4", "28.5.0.2"]
elixir = ["1.20.4-otp-29", "1.18.4-otp-27", "1.19.5-otp-28"]

[tasks.setup]
description = "Fetch the Elixir deps"
dir = "server"
run = """
set -eu
# Ensure hex/rebar exist first so a fresh toolchain doesn't prompt; the check is
# a fast no-op once installed.
mix hex.info >/dev/null 2>&1 || { mix local.hex --force && mix local.rebar --force; }
mix deps.get
"""

[tasks.dev]
description = "Start the controller with the Terra TUI in this terminal; cookie via RB_COOKIE (default rbtest)"
depends = ["setup"]
dir = "server"
run = """
set -eu
cookie="${RB_COOKIE:-rbtest}"
# Always boot with the connect-only epmd shim (see Server.Epmd): pinned endpoints
# (REDBUG_NODES / SSH tunnels) dial direct, unpinned names fall back to real epmd.
# The shim module only loads once the app starts, so distribution must NOT come up
# at boot via --name; the app self-distributes (CONTROLLER_NODE) afterwards.
# REDBUG_DIST=off starts no distribution, so it needs no epmd flags (see Server.Dist).
if [ "${REDBUG_DIST:-}" != off ]; then
  export ERL_FLAGS="-start_epmd false -epmd_module Elixir.Server.Epmd${ERL_FLAGS:+ $ERL_FLAGS}"
fi
export CONTROLLER_NODE="redbug_controller@127.0.0.1"
export CONTROLLER_COOKIE="$cookie"
# One BEAM: the TUI (Server.Tui) takes this terminal and writes the log to
# REDBUG_SERVER_LOG (default /tmp/redbug-server.log). Quitting the TUI stops it.
exec elixir -S mix run --no-halt
"""

[tasks.package]
description = "Build the release server/_build/prod/rel/server (run bin/server start)"
depends = ["setup"]
dir = "server"
run = """
set -eu

# The release bundles the ERTS that builds it. Fail here when that ERTS is not
# the one of the [tools] pins (erlang 29.1.1 ships ERTS 17.1).
want_erts="17.1"
got_erts=$(erl -noshell -eval 'io:format("~s",[erlang:system_info(version)]),halt().')
case "$got_erts" in
  "$want_erts"|"$want_erts".*) ;;
  *) echo "ERROR: building with ERTS $got_erts, expected $want_erts.x (see [tools] in mise.toml)" >&2; exit 1 ;;
esac

MIX_ENV=prod mix release server --overwrite
echo "packaged -> server/_build/prod/rel/server (start: server/_build/prod/rel/server/bin/server start)"
"""
