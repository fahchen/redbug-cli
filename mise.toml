[tools]
erlang = "28.3"
elixir = "1.19.5-otp-28"
bun = "1.3"

[tasks.dev]
description = "Start server (random free port) then TUI; cookie via RB_COOKIE (default rbtest)"
dir = "server"
run = """
set -e
cookie="${RB_COOKIE:-rbtest}"
port_file="/tmp/redbug.port"
rm -f "$port_file"
export REDBUG_PORT_FILE="$port_file"
elixir --name redbug_controller@127.0.0.1 --cookie "$cookie" -S mix phx.server &
server_pid=$!
trap 'kill $server_pid 2>/dev/null' EXIT INT TERM
until [ -f "$port_file" ]; do sleep 0.2; done
port=$(cat "$port_file")
until nc -z 127.0.0.1 "$port" 2>/dev/null; do sleep 0.2; done
cd ../tui && REDBUG_PORT="$port" bun run dev
"""

[tasks.package]
description = "Build single-file dist/redbug (bun --compile embedding the server release) + standalone TUI for sidecar"
run = """
set -e
root="$(pwd)"
# Build the controller release (ERTS bundled) and tar it for embedding.
cd "$root/server" && MIX_ENV=prod mix release server --overwrite
mkdir -p "$root/tui/embed"
tar -czf "$root/tui/embed/server.tar.gz" -C "$root/server/_build/prod/rel" server
# redbug = single file (main.tsx embeds the tarball, extracts + spawns it at runtime).
# redbug-tui = standalone TUI (index.tsx), only needed to reach a remote sidecar server.
# Both compile straight into the root dist/ (build scripts target ../dist).
rm -rf "$root/dist"
mkdir -p "$root/dist"
cd "$root/tui" && bun install && bun run build:bin && bun run build:redbug
chmod +x "$root/dist/redbug" "$root/dist/redbug-tui"
echo "packaged -> dist/redbug (single file; run it to launch) + dist/redbug-tui (sidecar)"
"""
